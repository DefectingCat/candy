[package]
name = "candy"
version = "0.1.0"
edition = "2024"

[dependencies]
# 异步运行时
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "signal", "sync", "time", "fs", "test-util", "macros"] }

# HTTP 类型
http = "1"
bytes = "1"

# TLS
rustls = "0.23"
rustls-pemfile = "2"
tokio-rustls = "0.26"

# 配置
toml = "1"
serde = { version = "1", features = ["derive"] }

# 系统调用
nix = { version = "0.31", features = ["process", "signal", "socket", "net"] }
libc = "0.2"

# 错误处理
thiserror = "2"

# 压缩
flate2 = "1"

# 日志
chrono = "0.4"

# 信号处理
ctrlc = "3"

[dev-dependencies]
criterion = "0.8"
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true

[[bench]]
name = "performance"
harness = false